name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A superseded run proves nothing about the head anyone will merge, and these
# jobs each launch several real Chromium instances. Master is excluded on
# purpose: every commit there is a merge somebody will bisect later, so its
# result is worth the minutes even when the next merge lands behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  unit:
    name: Lint, unit tests, chaos, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # First, and before the browser download, because it is the cheapest
      # failure in this file — seconds against the minutes everything below
      # costs.
      #
      # It is also the only thing here that runs the React Compiler rules.
      # `eslint-config-next` enables sixteen `react-hooks/*` rules and most are
      # errors, `react-hooks/refs` and `react-hooks/set-state-in-effect` among
      # them: refs read during render, state set from an effect. Every other
      # gate in this workflow renders straight past that class of defect — the
      # unit suite does not mount these components, the build only type-checks
      # them, and the hydration suite asserts what a page does rather than how
      # it got there. So these rules have sat at error severity, on every
      # commit, enforced by nothing but whoever remembered to run `npm run
      # lint` locally.
      #
      # `eslint` exits 0 on warnings and 1 on errors, so this used to gate on
      # errors only, with thirteen `no-unused-vars` warnings standing. The
      # cleanup commit that paragraph deferred has now happened: six were dead
      # imports and are gone, and the other eight were deliberate discards the
      # rule could not see, which `eslint.config.mjs` now recognises by their
      # leading underscore.
      #
      # So `npm run lint` carries `--max-warnings 0` and this step gates on
      # warnings too. The threshold lives in the script rather than here, so the
      # pre-push gate in `localci.yml` enforces exactly what CI does. To keep a
      # binding this rule would otherwise flag, prefix it with `_`; that is the
      # documented way through, and it is deliberately cheap because the
      # alternative is somebody pushing with `--no-verify`, which skips the
      # react-hooks rules above along with everything else.
      #
      # The count had already drifted from thirteen to fourteen before anyone
      # went back to it, which is the argument for a gate rather than a tidy.
      - run: npm run lint
      # Beside `lint` and before the browser download, for the same reason: it
      # is seconds against the minutes below it.
      #
      # `next build` type-checks too, but through `tsconfig.json`, which
      # excludes `tests/integrations/**` — so the browser and hydration suites,
      # the two that drive a real browser and the two whose failures have
      # reddened master, were type-checked by nothing at all. Turning this on
      # found seven errors that had been sitting in them, including five
      # `expect.poll` calls passing Playwright's `intervals: [n]` to Vitest,
      # which takes `interval: n` — so the option was dropped and those polls
      # ran at Vitest's 50ms default instead of the 1–3s they asked for, two of
      # them inside the wizard walk that keeps flaking.
      #
      # `npm run build:kernel` is not this: it emits, and it excludes
      # `src/app/**`. See `tsconfig.typecheck.json` for why this is a third
      # config rather than a widening of the first.
      - run: npm run typecheck
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - run: npm run chaos
        env:
          CHAOS_ENABLED: 'true'
      - run: npm run build
      # Before hydration: `test:hydration` uploads a real PDF and the JVM
      # answers it, and the toolchain resolver counts compiled classes as
      # availability. Without this the document cases either skip silently on
      # a fresh runner or, worse on a warm one, run against classes built from
      # different source. localci.yml carries the same ordering and the longer
      # note.
      - run: npm run build:documents
      # Drives the built app in a real browser. The unit suite, the type
      # checker and the build are all blind to whether a page hydrates.
      - run: npm run test:hydration

  browser:
    name: Browser journey tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser

  database:
    # The unit suite runs the store contract against the in-memory double, so
    # it needs no database. This job runs the SAME contract against real
    # Postgres, which is the only thing that can catch the two drifting apart
    # — a round trip that silently changes a record is invisible to a double
    # that stores the object verbatim.
    #
    # Skipped rather than failed without a secret: a fork's pull request has no
    # access to it, and a job that fails for everyone outside the repo trains
    # people to ignore red.
    #
    # Point the secret at a dedicated Neon branch, NOT at production. The
    # contract writes and deletes rows; it namespaces them under `contract-%`
    # and cleans up after itself, but a test suite with delete rights on the
    # database holding real client evidence is a blast radius nobody needs.
    name: Database store contract
    runs-on: ubuntu-latest
    # Parallel again, and safe because the rows are namespaced rather than
    # shared. This job used to carry a `concurrency` group serialising it
    # across every branch: every run points at the same `DATABASE_URL`, and
    # both contracts cleared `contract-%` and `pc-%` — every run's rows — in a
    # `beforeEach`. Runs #158, #159 and #160 started within nine seconds of
    # each other and all three failed on foreign-key violations against rows
    # that should have existed; #159 was a push, so it took master red with it
    # over a documentation-only diff.
    #
    # Each process now writes under its own `contract-<nonce>` / `pc-<nonce>`
    # prefix and deletes only that, so overlapping runs cannot see each other.
    # `postgres-contract-isolation.test.ts` is what holds that true: it drives
    # the same cleanup this suite uses against a second run's rows and asserts
    # they survive — including the age-bounded sweep, which is the one part
    # that still matches the shared prefix and so is the one part that could
    # bring the blast radius back.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply schema and run the store contract
        if: env.DATABASE_URL != ''
        run: npm run migrate && npm run test:db
      - name: Report that the contract was skipped
        if: env.DATABASE_URL == ''
        run: echo "::warning::DATABASE_URL not set — the Postgres store contract did not run."
