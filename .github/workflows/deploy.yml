name: Deploy

# Production builds run HERE, inside an Amazon Linux 2023 container on a GitHub
# runner, and Vercel receives finished output through `--prebuilt`. Vercel's own
# builders are switched off in vercel.json's `ignoreCommand`.
#
# WHY THIS EXISTS
#
# `vercel-build` is not `next build`. It is
#
#     prepare-jvm && prepare-verapdf && prepare-libreoffice && next build
#
# — a Temurin JDK, a veraPDF install and a ~350 MB LibreOffice tarball fetched
# and assembled into /vendor. That ran on Vercel's metered builders on EVERY
# push to EVERY branch, because the project had no ignored build step. This
# repository is public, so the identical work on a GitHub runner is free and
# unmetered.
#
# WHY A CONTAINER, AND WHY THIS ONE
#
# A bare `ubuntu-latest` cannot build this. Two reasons, both in
# scripts/prepare-libreoffice.ts:
#
#   1. It installs BUILD_IMAGE_PACKAGES through `dnf`/`microdnf` only, by RPM
#      name (nss, libX11, cups-libs, dbus-libs, cairo, ...). On Ubuntu neither
#      manager exists and none of those names resolve, so the collector's ldd
#      gate throws: "the build image cannot resolve N of LibreOffice's
#      libraries". The build fails loudly rather than shipping something
#      broken, which is the good outcome — but it does not build.
#
#   2. The worse failure is the one that would follow from satisfying that gate
#      with Debian equivalents. The collector copies resolved system libraries
#      OUT OF THE BUILD HOST and into the function bundle, deliberately
#      excluding core glibc (NEVER_COPY) so the runtime supplies its own.
#      Ubuntu 24.04 is glibc 2.39; Vercel's runtime is glibc 2.34. Libraries
#      collected on Ubuntu can resolve at build time and then die at exec in
#      production. That is precisely the class the script's header describes as
#      invisible to build-image verification.
#
# amazonlinux:2023 IS the "runtime-faithful sim" that file names. Every
# BUILD_IMAGE_PACKAGES entry resolves there, and the toolchain was verified in
# the image before this workflow was written: node 22.23.2, npm 10.9.8,
# glibc 2.34.
#
# Note `nodejs22` does NOT bring npm on Amazon Linux — `nodejs22-npm` is a
# separate package. Installing only `nodejs22` leaves `npm: command not found`.
#
# SECRETS
#
# VERCEL_ORG_ID, VERCEL_PROJECT_ID and VERCEL_TOKEN must be set as repository
# secrets, taken from the Vercel account that owns this project.
#
# The org and project ids are read from the environment. The TOKEN is passed
# with `--token=` on every CLI call, because the environment variable the docs
# describe does not authenticate CLI 50.23.2 — run 33975934852 failed on
# exactly that; see the comment on the pull command below. Nothing here runs
# under `set -x` and GitHub masks registered secrets, so the flag does not
# surface the token in logs.

on:
  push:
    branches: [master]
    # Paths that cannot change deployable output are excluded: a docs-only
    # commit that produces an identical bundle is not worth a deploy.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'next.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/deploy.yml'
  # Preview deployments are on demand rather than per push. Vercel used to
  # build one for every branch push automatically, which is the cost this
  # change exists to remove; run this manually with target=preview when a
  # preview URL is actually wanted.
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned rather than `latest`: the CLI is what interprets vercel.json and
  # writes .vercel/output, so an unpinned bump can change build output without
  # a commit.
  VERCEL_CLI: vercel@50.23.2
  BUILD_IMAGE: amazonlinux:2023

jobs:
  deploy:
    name: Build on a runner, deploy prebuilt
    runs-on: ubuntu-latest
    # The LibreOffice/JDK fetches dominate a cold build; a warm vendor cache
    # brings this down to roughly the length of `next build`.
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Require Vercel credentials
        # Fail here, with a name, rather than 20 minutes later inside the
        # container where the CLI's own error does not say which of the three
        # is missing.
        run: |
          missing=
          for v in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Take them from the Vercel account that owns this project (Settings -> General for the project id, Settings -> Tokens for the token)."
            exit 1
          fi

      - name: Resolve target
        id: target
        run: |
          target='${{ inputs.target }}'
          [ -n "$target" ] || target=production
          if [ "$target" = production ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploying to $target"

      - uses: actions/checkout@v7

      - name: Restore prepared build artifacts
        uses: actions/cache@v6
        with:
          # BOTH directories, and the second one is not optional.
          #
          # `prepare-jvm.ts` returns early when `vendor/jre/bin/java` exists,
          # and that return sits ABOVE its call to `build-documents.ts`. So a
          # restored `vendor/` skips the class compilation as well as the JDK
          # download — and `build-documents.ts` writes to TWO places:
          # `vendor/fonts/liberation`, which was cached, and
          # `dist/documents/classes`, which was not.
          #
          # Caching only `vendor` therefore produced a deployment whose JRE and
          # LibreOffice were present and whose Java stages were absent. The
          # conversion routes deploy clean and refuse every request with
          # `document stages are not compiled at dist/documents/classes`, which
          # is what `npm run smoke:documents` found against production on
          # 2026-09-06 — the first warm-cache deploy after the cache landed in
          # #208. The cold deploy before it converted fine, which is exactly
          # why nothing caught this: the bug needs a SECOND deploy to appear.
          #
          # Recompiling instead of caching is not a drop-in alternative:
          # `build-documents.ts` needs `javac` from the full JDK, and on the
          # early-return path the JDK was never downloaded — `vendor/jre` is a
          # jlink'd runtime with no compiler in it.
          path: |
            vendor
            dist/documents
          # The prepare scripts pin their own versions and checksums, so their
          # contents ARE the cache identity. `build-documents.ts` joins them
          # now that its output is cached too — without it, editing the Java
          # stages would restore stale classes over the new sources.
          key: vendor-al2023-${{ hashFiles('scripts/prepare-jvm.ts', 'scripts/prepare-verapdf.ts', 'scripts/prepare-libreoffice.ts', 'scripts/build-documents.ts') }}

      - name: Build in Amazon Linux 2023
        env:
          VERCEL_ENVIRONMENT: ${{ steps.target.outputs.environment }}
          BUILD_FLAG: ${{ steps.target.outputs.flag }}
        run: |
          docker run --rm -i \
            --platform linux/amd64 \
            -v "$PWD":/work -w /work \
            -e VERCEL_TOKEN -e VERCEL_ORG_ID -e VERCEL_PROJECT_ID \
            -e VERCEL_CLI -e VERCEL_ENVIRONMENT -e BUILD_FLAG \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$BUILD_IMAGE" bash -euo pipefail -s <<'CONTAINER'
          # amazonlinux:2023 is the right ABI, but it is BARE — Vercel's build
          # image is the same distro plus a toolchain, and three of the
          # binaries the prepare scripts shell out to are in that difference.
          # Each was measured in the image, not guessed:
          #
          #   binutils  provides objcopy. `jlink --strip-debug` (prepare-jvm)
          #             execs it to strip native libraries. Without it jlink
          #             exits 1 having printed its error to STDOUT, and
          #             execFile's error message only carries STDERR — so run
          #             34002062130 failed with a completely empty reason.
          #             That empty reason is no longer a property of the code —
          #             scripts/run-command.ts reports both streams, and
          #             prepare-jvm.ts now refuses before the 184MB download
          #             when objcopy is absent — but binutils is still REQUIRED
          #             here, because jlink still needs objcopy to run at all.
          #             Verified: with binutils, jlink exits 0 and produces a
          #             54M JRE that runs `java -version`.
          #
          #   cpio      prepare-libreoffice extracts an RPM, and its first and
          #             preferred attempt is `rpm2cpio | cpio -idmu`. rpm2cpio
          #             ships with the base image; cpio does NOT.
          #
          #   bsdtar    that extractor's second attempt. Worth having as well
          #             as cpio because the third and last fallback is GNU tar,
          #             which cannot read RPM at all — so without both of these
          #             every attempt fails and the build dies at "cannot
          #             extract ... no working extractor on this image".
          #
          # ldd and rpm2cpio, which these scripts also use, ARE in the base
          # image; adding packages for them would be noise.
          dnf install -y -q --setopt=install_weak_deps=False \
            nodejs22 nodejs22-npm git tar gzip xz findutils \
            binutils cpio bsdtar
          npm ci --no-audit --no-fund
          # --token is REQUIRED, and the previous revision of this file was
          # wrong to omit it. https://vercel.com/docs/cli/global-options says a
          # VERCEL_TOKEN environment variable authenticates the CLI, and on
          # 50.23.2 it does not: run 33975934852 forwarded VERCEL_TOKEN into
          # this container and `pull` still died with
          #
          #     Error: No existing credentials found.
          #     Please run `vercel login` or pass "--token"
          #
          # Env forwarding itself was fine in that run — $VERCEL_CLI resolved,
          # the CLI printed its own version — so the variable arrived and the
          # CLI ignored it. VERCEL_ORG_ID / VERCEL_PROJECT_ID are read from the
          # environment normally; only the token needs the flag.
          #
          # Nothing here runs under `set -x`, and GitHub masks registered
          # secrets in logs, so the flag does not put the token in the log.
          npx --yes "$VERCEL_CLI" pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build $BUILD_FLAG --token="$VERCEL_TOKEN"
          # Everything above ran as root on a bind mount. Hand the tree back so
          # the deploy step and the cache save can read and write it.
          chown -R "$HOST_UID:$HOST_GID" /work
          CONTAINER

      - name: Deploy prebuilt output
        id: deploy
        env:
          DEPLOY_FLAG: ${{ steps.target.outputs.flag }}
        run: |
          # Same --token requirement as the build step above; this one runs on
          # the host rather than in the container, but the CLI is the same.
          npx --yes "$VERCEL_CLI" deploy --prebuilt $DEPLOY_FLAG --token="$VERCEL_TOKEN" > deployment-url.txt
          url=$(cat deployment-url.txt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          rm -f deployment-url.txt

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          SMOKE_URL="${DEPLOY_URL%/}/api/ready"
          echo "Verifying $SMOKE_URL"
          BYPASS=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS="-H x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET"
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" $BYPASS "$SMOKE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - retrying in 10s"
            sleep 10
          done
          echo "::error::Smoke test failed after 5 attempts; last status HTTP $STATUS"
          exit 1

      # The step above proves the app BOOTS. It cannot prove it can convert, and
      # the difference is not academic: on 2026-09-06 a warm-cache deploy shipped
      # a build whose Java stages were missing, passed `/api/ready`, and refused
      # every real conversion. `/api/ready` is also its own Vercel function and
      # does not carry `vendor/libreoffice` at all, so it answers for an instance
      # that could never convert regardless.
      #
      # This runs the real thing: a synthesised .docx through
      # `/api/documents/remediate`, asserting the fingerprints only the Word lane
      # leaves — a heading count that survived the fodt round trip, a
      # `sourceLanguage` read out of `word/styles.xml`, and
      # `conformance.checker === 'verapdf-ua1'`, which is what proves veraPDF is
      # wired up rather than absent. A PDF upload would return an indistinguishable
      # 200 from a host with no LibreOffice, which is why the fixture is a .docx
      # and why the script refuses to send anything else.
      #
      # PRODUCTION ONLY. Preview deployments can sit behind Vercel protection,
      # which answers with an HTML 401 the probe would report as an auth failure;
      # the bypass-header flag was deliberately cut from the script as dead weight
      # when production turned out to be open. Re-add both together if this is
      # ever wanted on previews.
      # Pinned to the container's major, because the probe reuses the
      # `node_modules` that container installed. `ubuntu-latest` ships whatever
      # Node its current image happens to carry, and "whatever the runner has"
      # is not a version this repo has ever tested against.
      - name: Set up Node for the probe
        if: steps.target.outputs.environment == 'production'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Smoke test — a real document conversion
        if: steps.target.outputs.environment == 'production'
        env:
          AUDITOR_RUN_TOKEN: ${{ secrets.AUDITOR_RUN_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Absent secret SKIPS rather than fails. This step proves a capability;
          # a deploy that goes red because a probe was never configured teaches
          # people to ignore red, which is the thing the probe exists to prevent.
          # A secret that is present but WRONG still fails loudly — the script
          # names the exact cause, including the sub-16-character case that
          # `isRunAuthorized` otherwise rejects with an unexplained 401.
          if [ -z "$AUDITOR_RUN_TOKEN" ]; then
            echo "::warning::AUDITOR_RUN_TOKEN is not set as a repository secret — skipping the conversion probe. Add it (the value from this project's PRODUCTION Vercel environment) to exercise LibreOffice on every deploy."
            exit 0
          fi

          # `node_modules` is already on disk: the build step's container ran
          # `npm ci` against this same bind-mounted workspace. Reused rather than
          # reinstalled, with a fallback so a change to that step cannot turn this
          # one into a confusing module-not-found.
          if [ ! -x node_modules/.bin/tsx ]; then
            echo "node_modules is not usable here — installing"
            npm ci --no-audit --no-fund
          fi

          npm run smoke:documents -- --base "$DEPLOY_URL"
