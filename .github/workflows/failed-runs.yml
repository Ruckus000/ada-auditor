name: Failed runs

# A production audit that ran and failed is seen by a human within a day.
#
# It was not. `/api/cron/tick` dispatches a run and returns 200 long before it
# finishes — the work happens under `waitUntil` — so the tick counts it as
# `started`, writes "Scheduler started a scheduled run" to the activity feed,
# and never learns the outcome. Nothing on the journey row records one either:
# "dispatched" and "audited successfully" are the same state there.
#
# The screens do not close the gap. The portfolio is the only view spanning
# clients and its rows carry no `failureReason` at all, and both the portfolio
# and the client detail read one run per journey — so last night's failure is
# erased by tonight's success before anyone opens the page.
#
# ## Two checks, because there are two ways a night can go wrong
#
# The first reads recorded runs, so it sees a run that executed and failed, and
# a run reconciled to `run_timed_out`.
#
# A run refused *before* it was recorded is invisible to that query, and still
# leaves no row: whether a run that never started deserves one is a decision
# about baselines, scoring and the newest-run-per-journey read, and the answer
# was no. So the scheduler records an **activity event** instead, and the
# second check counts those. `SCHEDULED_RUN_NOT_STARTED` in
# `src/domain/platform.ts` is the string both sides agree on;
# `tests/deploy/failed-runs-workflow.test.ts` is what stops them drifting.
#
# ## What this still does not cover, said here rather than discovered later
#
# A refusal to a *direct* caller — a 429 from `/api/audit/run` to CI or to the
# console — is not the scheduler's to record, and that caller already has the
# 429 in its hand. And a tick that never authorized writes nothing at all,
# because it never claimed anything; the readiness step below covers that one
# by asking whether `CRON_SECRET` exists. So this job still never reports "all
# is well", only what it actually checked.
#
# ## Why an issue, and why it says so little
#
# An issue rather than a chat message, and one issue rather than one a night,
# for the reasons `prune-artifacts.yml` sets out: it persists until somebody
# closes it, it needs no third-party service that can itself be misconfigured,
# and a job that goes red repeatedly trains people to ignore red.
#
# But this repository is public and `prune-artifacts.yml` only ever reports our
# own infrastructure. A run belongs to a client, and `journeyId` is
# `clientIdFromName(clientId + journey name)` — it reads as `acme-corp-checkout`.
# Publishing that would say, on the public internet and with a timestamp, that
# a named organisation is a client and that its accessibility audit is failing.
#
# So nothing identifying is published: the `requestId` is a `randomUUID`, the
# environment is one of four words, and `failureReason` is a closed enum of
# codes. An operator takes the requestId to the authenticated console and finds
# the client, the journey and the findings there. The redaction happens in the
# `jq` rather than at the point of printing, because the Actions log of a public
# repository is as public as the issue.
on:
  schedule:
    # 06:47 UTC — after the overnight hours a daily journey is most likely to
    # be scheduled for, and offset off the hour so it does not queue behind
    # everything else that runs at :00.
    - cron: '47 6 * * *'
  workflow_dispatch:

# The default token is read-only once any permission is named.
permissions:
  contents: read
  issues: write

env:
  # Pinned rather than a dispatch input. An input here would let whoever runs
  # this workflow choose which host receives `AUDITOR_RUN_TOKEN` as a bearer
  # header — the same trust `selfUrl()` in the tick route refuses to place in a
  # request header, for the same reason. Dispatch needs write access, so the
  # actor is already trusted; that is a reason not to hand them the token
  # anyway, not a reason it is safe. Pointing this elsewhere means editing the
  # file, where it is reviewable.
  BASE_URL: 'https://ada-auditor-psi.vercel.app'
  # Above the 24h schedule period on purpose. GitHub's scheduled runs are
  # best-effort and routinely late, and a lookback equal to the period leaves
  # the drift as time no run ever examined. Re-reporting the same failure is
  # free — the issue is deduplicated by title and updated rather than
  # duplicated.
  LOOKBACK_HOURS: '26'
  # The route caps `limit` at 100. If a response comes back holding exactly
  # this many, the window may extend past what was read and "nothing failed" is
  # not a claim this job can make — see the truncation branch below.
  RUN_LIMIT: '100'
  # The one value the second check sends, and the only thing it pins. It must
  # equal `SCHEDULED_RUN_NOT_STARTED` in `src/domain/platform.ts`; a test in
  # the fast suite asserts this file contains that string, because a copy-edit
  # to the constant would otherwise leave this matching a string nothing writes
  # — reporting zero every night, which is what a good night looks like too.
  NOT_STARTED_ACTION: 'could not start a scheduled run'
  # As `RUN_LIMIT`, and for the same reason: a count read off a response that
  # came back full does not cover its window. `/api/platform/activity` caps at
  # 200, so this is well inside what the route will answer.
  EVENT_LIMIT: '100'

jobs:
  failed-runs:
    name: Report production runs that failed in the last day
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Asks whether the deployment is configured before asking it anything
      # else, because on 2026-08-23 it was not and this job found out the
      # expensive way: `AUDITOR_RUN_TOKEN` was set nowhere — not here, not in
      # Vercel — so the scan below exited on its own guard and filed #85.
      #
      # `ready/route.ts` already says "the deploy checklist tells an operator to
      # look for an empty warnings array". That check existed and was performed
      # by hand, which is another way of saying it was performed when somebody
      # remembered. This is the same check on a schedule.
      #
      # Unauthenticated on purpose — `/api/ready` takes no `Request` and reads
      # no header, so this runs even when the very credential it is checking is
      # the thing that is missing. That is the whole point: a readiness probe
      # that needed the token could not report the token gone.
      #
      # No `--fail`: readiness answers 503 when it is not ready, and the body is
      # exactly what this step needs to read. curl still exits non-zero for a
      # network failure, which `set -e` turns into a skipped scan and the meta
      # issue below.
      - name: Ask the deployment whether it is configured
        id: ready
        run: |
          set -euo pipefail

          STATUS=$(curl --silent --show-error --max-time 20 \
            -o ready.json -w '%{http_code}' "${BASE_URL}/api/ready")

          if [ "${STATUS}" != '200' ] && [ "${STATUS}" != '503' ]; then
            echo "reason=/api/ready answered HTTP ${STATUS}" >> "$GITHUB_OUTPUT"
            echo "::error::/api/ready answered HTTP ${STATUS}"
            exit 1
          fi

          # Deliberately NOT "warnings is empty". `blobConfigured`,
          # `unlockThrottleDurable` and `sessionSecretDedicated` can each warn on
          # a deployment that is working, and a check that is permanently red is
          # one people stop reading — which is how the retention sweep failed
          # eleven nights into an empty room. Two conditions, both of which mean
          # production audits are not happening:
          #
          #  - `status` is gated on `auditorRunTokenConfigured` and
          #    `runStoreConfigured`, so not-ready means the machine credential or
          #    the database is gone. This is the one that fired on 08-23.
          #  - `cron_secret_not_configured` means Vercel's hourly call carries no
          #    bearer, `authorized()` in `cron/tick/route.ts` falls through to
          #    `isRunAuthorized`, and every journey schedule silently never
          #    fires. Nothing else in this job can see that: it reads *recorded*
          #    runs, and a tick that never authorized records nothing.
          READY=$(jq -r '.status' ready.json)
          NO_CRON=$(jq -r '[.warnings[] | select(startswith("cron_secret_not_configured"))] | length' ready.json)

          if [ "${READY}" != 'ready' ]; then
            REASON=$(jq -r '[.checks | to_entries[] | select(.value == false) | .key] | join(", ")' ready.json)
            echo "reason=/api/ready reports ${READY}; failing checks: ${REASON}" >> "$GITHUB_OUTPUT"
            echo "::error::/api/ready reports ${READY} (failing: ${REASON})"
            exit 1
          fi

          if [ "${NO_CRON}" != '0' ]; then
            echo "reason=CRON_SECRET is not configured, so journey schedules never fire" >> "$GITHUB_OUTPUT"
            echo "::error::CRON_SECRET is not configured, so journey schedules never fire"
            exit 1
          fi

          echo "the deployment reports ready, with a cron secret configured"

      # Reads the *returned* status rather than filtering server-side on it,
      # and that is load-bearing. A run whose invocation died is stored
      # `running` and only becomes `failed` when `reconcileRunStatus` sees it on
      # read, so a stored-status query would miss precisely the failures nobody
      # noticed. `/api/audit/runs` reconciles on the way out.
      #
      # `environment` *is* filtered server-side, because that one is stored
      # exactly and narrowing it also narrows the payload: `list()` hydrates
      # every run with its pages and findings, `htmlSnippet` included.
      - name: Ask the deployment what failed
        id: scan
        env:
          AUDITOR_RUN_TOKEN: ${{ secrets.AUDITOR_RUN_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${AUDITOR_RUN_TOKEN}" ]; then
            echo "::error::AUDITOR_RUN_TOKEN is not set, so this check cannot run"
            exit 1
          fi

          # A minute rather than thirty seconds: this is a hydrated payload and
          # it grows with history. If it still cannot complete, curl fails and
          # the meta issue fires — a check that cannot finish should say so.
          curl --fail --silent --show-error --max-time 60 \
            -H "authorization: Bearer ${AUDITOR_RUN_TOKEN}" \
            "${BASE_URL}/api/audit/runs?environment=production&limit=${RUN_LIMIT}" > runs.json

          SINCE=$(date -u -d "${LOOKBACK_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"

          # How many runs came back at all, so truncation can be detected. Not
          # how many failed.
          jq -r '"returned=\(.runs | length)"' runs.json >> "$GITHUB_OUTPUT"

          # ISO-8601 UTC is fixed-width and zero-padded, so a string comparison
          # orders it correctly and no date parsing is needed. The `sub` drops
          # the milliseconds our timestamps carry, which `fromdateiso8601`
          # would refuse anyway.
          #
          # The projection is the redaction: requestId, environment, reason,
          # timestamp. No `journeyId`, and nothing else from the record.
          jq -r --arg since "${SINCE}" '
            [ .runs[]
              | select(.status == "failed")
              | select((.createdAt | sub("\\.[0-9]+Z$"; "Z")) > $since)
              | { requestId, environment, reason: (.failureReason // "no reason recorded"), createdAt }
            ]
          ' runs.json > failed.json

          jq -r '"count=\(length)"' failed.json >> "$GITHUB_OUTPUT"

          jq -r '.[] | "- run `\(.requestId)` (\(.environment)) — \(.reason) — \(.createdAt)"' \
            failed.json > failures.md

          cat failures.md

      # The other way a night goes wrong: a journey that was due and never
      # started. There is no run to read, so this reads the activity event the
      # scheduler writes instead.
      #
      # Filtered server-side on `action` and `since`, and that is the whole
      # design. This step sends one pinned value and counts what comes back; it
      # never parses free text, because an activity event carries a client id
      # and a journey's *name* and this repository is public.
      #
      # The one field it does read out of the payload is `metadata.code`, and
      # only because that value is allowlisted where it is written: the tick's
      # `refusalCode` accepts `^[a-z][a-z0-9_]{0,63}$` and nothing else, so a
      # response body cannot put a credential or a forged log line there. The
      # `test` below re-checks it anyway — a row written by some future caller
      # has not been through that allowlist, and the cost of checking twice is
      # a line of jq.
      - name: Ask the deployment what never started
        id: notstarted
        env:
          AUDITOR_RUN_TOKEN: ${{ secrets.AUDITOR_RUN_TOKEN }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d "${LOOKBACK_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"

          # `--get --data-urlencode` rather than an interpolated query string:
          # the action is a sentence with spaces in it.
          curl --fail --silent --show-error --max-time 30 \
            -H "authorization: Bearer ${AUDITOR_RUN_TOKEN}" \
            --get \
            --data-urlencode "action=${NOT_STARTED_ACTION}" \
            --data-urlencode "since=${SINCE}" \
            --data-urlencode "limit=${EVENT_LIMIT}" \
            "${BASE_URL}/api/platform/activity" > events.json

          # The server already narrowed to the action and the window, so the
          # count of what came back *is* the answer.
          jq -r '"count=\(.count)"' events.json >> "$GITHUB_OUTPUT"

          # A count per cause, and nothing else. No client id, no journey name,
          # no subject, no timestamp — an operator takes the cause to the
          # authenticated Activity screen and finds the journey there.
          jq -r '
            [ .events[]
              | (.metadata.code // "unrecognised")
              | if type == "string" and test("^[a-z][a-z0-9_]{0,63}$")
                then . else "unrecognised" end
            ]
            | group_by(.) | map({ code: .[0], count: length })
            | sort_by(-.count)[]
            | "- \(.count) × `\(.code)`"
          ' events.json > causes.md

          cat causes.md

      # `always()`, because the case this job exists to prevent is a check that
      # quietly stopped checking. If the step above cannot reach the deployment,
      # or the token has rotated, or the window could not be covered, that is
      # itself worth an issue — the retention sweep failed eleven nights into an
      # empty room for exactly that reason.
      #
      # One block for every outcome rather than near-identical ones: the title
      # and body are decided first, and the filing is written once — now as a
      # shell function, because there are two independent things to report.
      #
      # The two are filed as separate issues on purpose. A run that failed and
      # a run that never started have different causes, different owners and
      # different fixes; folded into one issue, closing either would close
      # both.
      - name: File an issue if there is something to say
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No `actions/checkout` in this job — it needs no source. `gh` infers
          # the repository from the checkout otherwise, so it is named here.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          # Empty unless readiness itself is what failed. Outputs written before
          # a step exits non-zero survive it, which is what makes this readable
          # from the branch that fires precisely because that step failed.
          READY_CAUSE: ${{ steps.ready.outputs.reason }}
          FAILED_COUNT: ${{ steps.scan.outputs.count }}
          RETURNED: ${{ steps.scan.outputs.returned }}
          SINCE: ${{ steps.scan.outputs.since }}
          NOT_STARTED_OUTCOME: ${{ steps.notstarted.outcome }}
          NOT_STARTED_COUNT: ${{ steps.notstarted.outputs.count }}
          NOT_STARTED_SINCE: ${{ steps.notstarted.outputs.since }}
        run: |
          set -euo pipefail

          # Exact title match over open *and* closed, so a recurrence reopens
          # the original thread rather than starting a parallel one. A function
          # rather than a tail block, because there are now two independent
          # things this step may have to report and only one way to report.
          file_issue() {
            local TITLE="$1"
            local BODY="$2"
            local EXISTING
            EXISTING=$(gh issue list --state all --limit 100 --json number,title \
              --jq "first(.[] | select(.title == \"${TITLE}\") | .number) // empty")
            if [ -n "${EXISTING}" ]; then
              gh issue reopen "${EXISTING}" 2>/dev/null || true
              gh issue comment "${EXISTING}" --body "${BODY}"
              echo "updated issue #${EXISTING}"
            else
              gh issue create --title "${TITLE}" --body "${BODY}"
            fi
          }

          # Either check failing means this job is not watching production, so
          # both fold into the one meta issue and nothing else is filed. A
          # count produced by a job that half ran is not a number to act on.
          if [ "${SCAN_OUTCOME}" != "success" ] || [ "${NOT_STARTED_OUTCOME}" != "success" ]; then
            # The readiness step runs first and skips the rest when it fails, so
            # the outcomes are "skipped" rather than "failure" in that case and
            # land here either way — one branch, as before. What changes is that
            # `READY_CAUSE` usually knows the answer now, where the line below it
            # could only ever offer a guess.
            if [ -n "${READY_CAUSE}" ]; then
              CAUSE="The deployment said why: ${READY_CAUSE}"
            else
              CAUSE='Most likely causes: AUDITOR_RUN_TOKEN was rotated without updating the repository secret, or the deployment moved.'
            fi
            BODY=$(printf '%s\n' \
              'This job could not ask the deployment which runs failed, or which scheduled runs never started, so nobody is watching production audits until it is fixed.' \
              '' \
              "Failed run: ${RUN_URL}" \
              '' \
              "${CAUSE}")
            file_issue 'The failed-run check could not run' "${BODY}"
            exit 0
          fi

          # ------------------------------------------- runs that failed --

          # An empty `TITLE` means "nothing to file for this half", which is
          # what lets one filing call serve every outcome below it.
          TITLE=''

          # Truncation is not a clean night — it is a check that did not cover
          # its window — so it joins the "could not run" branch rather than
          # becoming a third kind of alert. It is also the tripwire for adding a
          # lighter projection to `/api/audit/runs`: until this fires, one does
          # not need to exist.
          if [ "${RETURNED}" = "${RUN_LIMIT}" ]; then
            TRUNCATED=true
          else
            TRUNCATED=false
          fi

          if [ "${TRUNCATED}" = "true" ]; then
            # Titled for the truncation, because not covering the window is the
            # more serious fact — but it carries the failure list too. Folding
            # this into the meta branch first made the worse night produce the
            # *less* actionable alert: a count with no request ids to look up,
            # where an ordinary night hands over the lot. The ids are the one
            # thing safe to publish, so there is no reason to withhold them
            # exactly when something is already wrong.
            TITLE='The failed-run check could not cover its window'
            BODY=$(printf '%s\n' \
              "The runs endpoint returned its maximum of ${RUN_LIMIT} records, so runs older than the newest ${RUN_LIMIT} were never examined and this job cannot say whether any of them failed." \
              '' \
              "It matched ${FAILED_COUNT} failure(s) in what it could see, since ${SINCE}:" \
              '' \
              "$(cat failures.md)" \
              '' \
              'Look each request id up in the console for the client, the journey and what went wrong — deliberately not published here, because this repository is public.' \
              '' \
              "Checked by: ${RUN_URL}" \
              '' \
              'Run volume has outgrown a single page. The fix is a narrower query — the endpoint currently returns each run fully hydrated, with its pages and findings.')
          elif [ "${FAILED_COUNT}" != "0" ]; then
            TITLE='A production audit failed'
            BODY=$(printf '%s\n' \
              "${FAILED_COUNT} production run(s) failed since ${SINCE}. A failed run produces no findings and no score, so whichever client it belongs to has no audit for that night." \
              '' \
              "$(cat failures.md)" \
              '' \
              'Look each request id up in the console for the client, the journey and what went wrong — deliberately not published here, because this repository is public.' \
              '' \
              "Checked by: ${RUN_URL}" \
              '' \
              'This covers runs that were recorded. A scheduled run that never started leaves no row here either; it is counted separately, under its own issue.' \
              '' \
              'Updated rather than duplicated, and not closed automatically: a quiet night does not mean the cause was fixed.')
          fi

          if [ -n "${TITLE}" ]; then
            file_issue "${TITLE}" "${BODY}"
          else
            echo "no recorded production run failed since ${SINCE}"
          fi

          # ------------------------------ journeys that never started --

          # Its own issue, not a section of the one above. A run that failed and
          # a run that never started have different causes, different owners and
          # different fixes, and folding them together would mean closing one
          # closes both.
          if [ "${NOT_STARTED_COUNT}" = "0" ]; then
            echo "every scheduled run that was due since ${NOT_STARTED_SINCE} was dispatched"
            exit 0
          fi

          # The truncation guard, mirrored — but it can only ever fire on a
          # night that is already being reported. The runs scan filters what it
          # read, so a full page there can still mean zero failures; here the
          # server did the filtering, so the count *is* what came back and a
          # full page means the count is a floor rather than a total.
          if [ "${NOT_STARTED_COUNT}" = "${EVENT_LIMIT}" ]; then
            FLOOR="The activity endpoint returned its maximum of ${EVENT_LIMIT} events, so this is a floor rather than a total and the window is not fully covered."
          else
            FLOOR=''
          fi

          BODY=$(printf '%s\n' \
            "${NOT_STARTED_COUNT} scheduled run(s) were due since ${NOT_STARTED_SINCE} and never started. There is no failed run to look at, because there is no run at all — whichever clients they belong to simply have no audit for that night." \
            '' \
            'By cause:' \
            '' \
            "$(cat causes.md)" \
            '' \
            "${FLOOR}" \
            '' \
            'A count per cause is all that is published, and that is less actionable than the failed-run issue rather than equally so: there is no request id to look up, because there was no run. The client and the journey are on the authenticated Activity screen, filtered to this action — they are deliberately not here, because an activity event names a client and a journey and this repository is public.' \
            '' \
            "Checked by: ${RUN_URL}" \
            '' \
            'Updated rather than duplicated, and not closed automatically: a quiet night does not mean the cause was fixed.')

          file_issue 'A scheduled audit did not start' "${BODY}"
