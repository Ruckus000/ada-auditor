name: Smoke (real site)

# One real audit, against a real site, through the built application.
#
# This is the only check that exercises the *built* app. Vitest loads modules
# unbundled, so a packaging fault is invisible to every other suite — which is
# exactly how `@axe-core/playwright` once shipped with its injected source
# mangled while every run through the app failed and CI stayed green. The
# chaos suite calls the runner directly, so it cannot see that class of fault
# either.
#
# Manual only, and deliberately so: this depends on somebody else's site
# staying up, and a job that goes red for a third party's outage trains people
# to ignore red. `scripts/smoke-real.ts` says the same at the top of the file;
# this workflow is the "run it on demand" half of that decision.
#
# It also produces the numbers the page cap is supposed to be set from —
# `slowestPageMs`, `headroomMs`, `suggestedPageCap` — which is why the run
# needs a real site with real images, third-party scripts and network latency.
# A local fixture measures nothing about whether twenty pages fit in 300s.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Public, multi-page site to audit'
        required: true
        default: 'https://www.w3.org/WAI/'
      steps:
        description: 'Navigations to attempt (the first is the landing page)'
        required: false
        default: '6'

jobs:
  smoke:
    name: One real audit through `next start`
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build

      # Minted per run rather than read from a secret. The only server this
      # token guards is started and discarded inside this job, so a repository
      # secret would buy nothing and would be one more long-lived credential
      # to rotate. Masked so a stray log line cannot echo it.
      - name: Mint a throwaway run token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "AUDITOR_RUN_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start the built app
        env:
          # No DATABASE_URL, on purpose. This job must not write to the
          # database holding real client evidence, and `memory` is the
          # explicit opt-in the store requires rather than a silent fallback.
          # Nothing here needs to outlive the job.
          AUDITOR_STORE: memory
          # Artifacts fall back to local disk without a blob token, which is
          # enough to prove the run captured its evidence.
          #
          # Empty means the advisory pass is skipped, which is a supported
          # configuration and not a failure. Set the secret only if you want
          # the smoke run to exercise — and pay for — the model call too.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          npm start -- --port 3000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            # Any HTTP response means it is listening. `/api/ready` answers 503
            # without a database, which is correct in memory mode and is not
            # what this loop is waiting for.
            if curl -s -o /dev/null http://127.0.0.1:3000/api/ready; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::the built app never started listening"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      # Through the shell environment, not interpolated into the script: the
      # inputs are attacker-controlled text as far as the runner is concerned.
      - name: Run one real audit
        env:
          SMOKE_URL: ${{ inputs.url }}
          SMOKE_STEPS: ${{ inputs.steps }}
          # Twice the default, because the default is calibrated for a page the
          # runner already has in hand and this walk is a shared GitHub runner
          # clicking through somebody else's site. Both observed flakes were a
          # click timing out at ten seconds on markup that was fine.
          #
          # Deliberately no retry. This is the only check that exercises the
          # built bundle against a real site, and re-running it until it passes
          # is how a suite stops catching the thing it exists for.
          AUDITOR_STEP_TIMEOUT_MS: '20000'
        run: |
          npm run smoke:real -- --url "$SMOKE_URL" --steps "$SMOKE_STEPS" \
            --json "$RUNNER_TEMP/smoke-real.json"

      # The measurement, where somebody will actually look for it.
      #
      # The numbers this job exists to produce were only ever a line in a log
      # that scrolls past a Playwright install — so the run that finally
      # measured a real client app would be as hard to read as every run
      # before it. The table is the summary; the artifact is the copy you can
      # compare against next quarter's.
      #
      # `if: always()`, because a run that failed *because* it ran out of wall
      # clock is the most informative outcome this job has, and it is the one
      # where the step above exits non-zero.
      - name: Summarise the measurement
        if: always()
        run: |
          json="$RUNNER_TEMP/smoke-real.json"
          if [ ! -f "$json" ]; then
            echo "No measurement was written — the run did not get far enough." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Real-site smoke measurement"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            # Keys are pinned here, one per row, and nothing else is printed.
            # The target URL is deliberately not among them: it is
            # workflow input, and a value interpolated into a Markdown table can
            # carry a link or an image out of this page. Every value below is a
            # number, a status word or `n/a`, and each is fenced anyway.
            for key in pagesAudited truncatedPages truncationReason walkBudgetMs \
                       runDurationMs slowestPageMs medianPageMs headroomMs \
                       suggestedPageCap ciStatus evidenceStatus score; do
              value="$(jq -r --arg k "$key" '.[$k] // "n/a"' "$json")"
              printf '| `%s` | `%s` |\n' "$key" "$value"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Ninety days, matching `ARTIFACT_RETENTION_DAYS`: this is the dataset the
      # page cap and the walk budget get re-decided from, and a remediation
      # cycle is a quarter. It holds no client data — the target is a public
      # site named in the workflow input, and the object carries timings and
      # counts, never page content.
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-real-measurement
          path: ${{ runner.temp }}/smoke-real.json
          retention-days: 90
          if-no-files-found: ignore

      # The interesting failures — a mangled axe bundle, a Chromium that will
      # not launch, a page cap hit — are logged by the server, not by the
      # client that dispatched the run. Print it either way.
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log"
