# Local CI for ada-auditor. See ~/Documents/Coding/localci.
#
# Mirrors .github/workflows/ci.yml, minus the scaffolding that only exists
# because a CI runner starts empty. Notably absent: `npm ci`.
#
# `npm ci` deletes node_modules and reinstalls from the lockfile. On a runner
# that is free and necessary. Here it would wipe the tree you are working in --
# and the suite runs detached, in the background, while you keep editing. The
# working tree's node_modules IS what local CI should be testing. Lockfile
# integrity is a real concern and this does not cover it; that belongs in a
# check that runs on a schedule, not on every push.

# Blocks `git push`. 9 seconds, and it is the only thing here that runs the
# React Compiler rules -- eslint-config-next has sixteen react-hooks/* rules at
# error severity, and no other gate in this file sees that class of defect.
#
# `npm run lint` carries `--max-warnings 0`, so this is a zero-warning gate: a
# stray unused import blocks the push, not just a broken rule. The threshold is
# in the script rather than spelled out here, which is what keeps this file and
# ci.yml enforcing the same thing. A binding that has to stay gets a leading
# underscore -- see the note in eslint.config.mjs.
#
# `typecheck` carries `next typegen` inside the script, not as a step here.
# `next-env.d.ts` is generated and gitignored, and this phase runs before the
# suite that builds -- so on a fresh clone the type checker would otherwise run
# with the file absent. It passes that way, which is exactly the trouble: the
# Next globals arrive instead through four `import type { Metadata }` lines in
# `src/app/**`, and losing those weakens the check silently. Keeping it in the
# script is what stops this file and ci.yml from drifting on the ordering, as
# they did over `build:documents`. ~0.8s.
gate:
  - npm run lint
  - npm run typecheck

# Runs detached after the push, reporting as a commit status when it finishes.
# Ordered cheapest-first, so a failure costs the least time possible: the run
# stops at the first non-zero exit.
suite:
  - npm test
  # CHAOS_ENABLED is a per-step env in ci.yml. A step here is just a shell
  # command, so an inline prefix covers it without the engine needing per-step
  # env as a feature. The script hard-fails without it rather than skipping,
  # which is why this is not optional.
  - CHAOS_ENABLED=true npm run chaos
  - npm run build
  # Before hydration, not after it. `test:hydration` uploads a real PDF and
  # the JVM answers it (`it.runIf(documentToolchain.available)`), and the
  # resolver counts COMPILED CLASSES as availability -- so with the documents
  # build last, hydration ran the Java stages against whatever classes
  # happened to be on disk from some earlier run, on some earlier branch.
  # `[V]` That is not hypothetical: it failed exactly this way on a branch
  # that added a field to `Inspect`, because the previous branch's suite had
  # recompiled the classes without it. Stale classes make hydration's document
  # cases either pass against code that is not under test, or fail for a
  # reason that has nothing to do with the change.
  - if command -v java >/dev/null 2>&1 || [ -x "$JAVA_HOME/bin/java" ]; then npm run build:documents; else echo "no JVM - document stages skipped"; fi
  - npm run test:hydration
  - npm run test:browser
  # The same store contract the unit suite runs against an in-memory double,
  # this time against real Postgres -- the only thing that catches the two
  # drifting apart. Skipped without the branch configured, exactly as CI skips
  # it, so that a machine without one is not permanently red.
  #
  # It reads `.env.test.local`, NOT the `.env` localci injects. That is
  # deliberate and it is the safety property: `.env` here is whatever somebody
  # pulled from Vercel, which is production, and three of the contract's cases
  # call store methods that take no scope. One of them blanked production
  # evidence pointers the first time this step ever actually ran. See
  # `vitest.db.config.ts`.
  #
  # `migrate` reads DATABASE_URL, so it is pointed at the branch explicitly --
  # same shape as the `CHAOS_ENABLED=true` prefix above, no new capability
  # asked of the engine. Without it the schema would be applied to production.
  #
  # The guard is on the VARIABLE, not on the file. Gating on `-f
  # .env.test.local` sounds equivalent and is not: a placeholder or
  # half-written file would then source to nothing, hand `migrate` an empty
  # DATABASE_URL and take the suite red -- for a configuration state whose
  # whole point is to skip. Sourcing a file that is not there is harmless, so
  # the file check only guards the `.`, and the variable decides.
  - if [ -f .env.test.local ]; then set -a; . ./.env.test.local; set +a; fi; if [ -n "$DATABASE_URL_TEST" ]; then DATABASE_URL="$DATABASE_URL_TEST" npm run migrate && npm run test:db; else echo "DATABASE_URL_TEST not set - Postgres store contract skipped"; fi
  # The document stages against a real JVM. Guarded exactly like the Postgres
  # step above and for the same reason: a machine without a JDK should not be
  # permanently red over a subsystem it cannot run. The build now happens
  # above, before hydration, because hydration needs it too -- and it stays
  # guarded there, because `test:documents` skips itself when nothing is
  # compiled and a suite that silently skips everything is indistinguishable
  # from one that passed.
  - if command -v java >/dev/null 2>&1 || [ -x "$JAVA_HOME/bin/java" ]; then npm run test:documents; else echo "no JVM - document stages skipped"; fi
