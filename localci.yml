# Local CI for ada-auditor. See ~/Documents/Coding/localci.
#
# Mirrors .github/workflows/ci.yml, minus the scaffolding that only exists
# because a CI runner starts empty. Notably absent: `npm ci`.
#
# `npm ci` deletes node_modules and reinstalls from the lockfile. On a runner
# that is free and necessary. Here it would wipe the tree you are working in --
# and the suite runs detached, in the background, while you keep editing. The
# working tree's node_modules IS what local CI should be testing. Lockfile
# integrity is a real concern and this does not cover it; that belongs in a
# check that runs on a schedule, not on every push.

# Blocks `git push`. 9 seconds, and it is the only thing here that runs the
# React Compiler rules -- eslint-config-next has sixteen react-hooks/* rules at
# error severity, and no other gate in this file sees that class of defect.
#
# `npm run lint` carries `--max-warnings 0`, so this is a zero-warning gate: a
# stray unused import blocks the push, not just a broken rule. The threshold is
# in the script rather than spelled out here, which is what keeps this file and
# ci.yml enforcing the same thing. A binding that has to stay gets a leading
# underscore -- see the note in eslint.config.mjs.
gate:
  - npm run lint
  - npm run typecheck

# Runs detached after the push, reporting as a commit status when it finishes.
# Ordered cheapest-first, so a failure costs the least time possible: the run
# stops at the first non-zero exit.
suite:
  - npm test
  # CHAOS_ENABLED is a per-step env in ci.yml. A step here is just a shell
  # command, so an inline prefix covers it without the engine needing per-step
  # env as a feature. The script hard-fails without it rather than skipping,
  # which is why this is not optional.
  - CHAOS_ENABLED=true npm run chaos
  - npm run build
  # Before the hydration suite, not after it with `test:documents`.
  #
  # `test:hydration` drives the Java stages through the running app, so it has
  # always been able to test class files compiled from another revision -- the
  # defect `8c13433` fixed for `test:documents` and could not fix here, because
  # the only step that rebuilds ran three lines further down. `[V]` It bit on
  # 2026-08-29: classes from the 26th, a required `marked` field added to the
  # schema on the 28th, and two hydration cases failed -- one as a 60 second
  # timeout naming nothing. Same guard as the step below, so a machine without
  # a JDK still skips rather than going red.
  - if command -v java >/dev/null 2>&1 || [ -x "$JAVA_HOME/bin/java" ]; then npm run build:documents; else echo "no JVM - document stages not built"; fi
  - npm run test:hydration
  - npm run test:browser
  # The same store contract the unit suite runs against an in-memory double,
  # this time against real Postgres -- the only thing that catches the two
  # drifting apart. Skipped without a DATABASE_URL, exactly as CI skips it, so
  # that a machine without the Neon branch configured is not permanently red.
  # localci reads DATABASE_URL from a git-ignored .env in this directory.
  - if [ -n "$DATABASE_URL" ]; then npm run migrate && npm run test:db; else echo "DATABASE_URL not set - Postgres store contract skipped"; fi
  # The document stages against a real JVM. Guarded exactly like the Postgres
  # step above and for the same reason: a machine without a JDK should not be
  # permanently red over a subsystem it cannot run. The build still has to come
  # first -- `test:documents` skips itself when nothing is compiled, and a suite
  # that silently skips everything is indistinguishable from one that passed --
  # but it now happens above, before `test:hydration`, which needs it just as
  # much. Rebuilding here would be a no-op; the config's staleness guard is what
  # actually holds the invariant either way.
  - if command -v java >/dev/null 2>&1 || [ -x "$JAVA_HOME/bin/java" ]; then npm run test:documents; else echo "no JVM - document stages skipped"; fi
