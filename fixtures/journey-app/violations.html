<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Violations</title>
  </head>
  <body>
    <!--
      A deliberately inaccessible page. Each element below breaks a different
      WCAG success criterion, so a scan of this page proves the engine reports
      per-element findings with distinct selectors — not one document-level
      boolean, which is all the previous regex engine could produce.
    -->
    <main>
      <h1>Violations</h1>

      <!-- 1.1.1 Non-text Content -->
      <img id="no-alt" src="hero.png" />

      <!-- 4.1.2 Name, Role, Value (form element without a label) -->
      <input id="no-label" type="text" />

      <!-- 4.1.2 Name, Role, Value (control with no accessible name) -->
      <button id="no-name" type="button"></button>

      <!-- 2.4.4 Link Purpose -->
      <a id="no-link-text" href="/somewhere"></a>

      <!-- 1.3.1 Info and Relationships (th without scope in a data table) -->
      <table id="bad-table">
        <tr><td>Header</td><td>Other</td></tr>
        <tr><td>1</td><td>2</td></tr>
      </table>

      <!--
        2.5.8 Target Size (Minimum) — 16x16, well under the 24x24 floor.

        Two of them, side by side with no gap, because the rule spares an
        undersized target that has enough clear space around it. One tiny
        button alone in the flow can pass on spacing; two touching cannot.

        This element is why the rule is here at all: `target-size` ships
        `enabled: false` in axe-core, so 2.5.8 was mapped by
        `conformanceLevelFromTags`, listed in `wcag-reference`, and never once
        evaluated.
      -->
      <button id="tiny-target-a" type="button" style="width: 16px; height: 16px; padding: 0; font-size: 8px">A</button
      ><button id="tiny-target-b" type="button" style="width: 16px; height: 16px; padding: 0; font-size: 8px">B</button>

      <!-- 1.4.3 Contrast (grey on white) -->
      <p id="low-contrast" style="color: #bbbbbb; background-color: #ffffff">
        Hard to read text.
      </p>
    </main>
  </body>
</html>
